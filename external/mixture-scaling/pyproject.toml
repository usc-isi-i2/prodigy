[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-scaling"
version = "0.1.0"
description = "Controlled graph pretraining mixture-scaling experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "wandb>=0.19.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["matplotlib>=3.8", "pandas>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
