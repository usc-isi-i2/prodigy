protocol:
  seed: 0
  split_seed: 1729
  input_dim: 768
  hidden_dim: 256
  output_dim: 256
  layers: 1
  dropout: 0.0
  fanout: 15
  sampling_backend: torch_sparse
  ssl_batch_size: 1024
  negatives_per_positive: 5
  learning_rate: 0.001
  weight_decay: 0.00001
  max_steps: 10000
  checkpoint_steps: [100, 300, 600, 900, 1500, 2500, 5000, 7500, 10000]
  validation_interval: 250
  validation_batches: 20
  ssl_edge_validation_fraction: 0.10
  ssl_edge_split_seed: 2718
  minimum_steps: 2500
  min_relative_improvement: 0.002
  patience_evaluations: 5
  probe_c_values: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  finetune_learning_rate: 0.001
  finetune_weight_decay: 0.00001
  finetune_max_epochs: 500
  finetune_min_epochs: 30
  finetune_patience: 30
  finetune_checkpoint_interval: 10
