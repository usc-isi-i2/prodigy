# Tiny caps for a fast end-to-end smoke.
dataset_len_cap: 20
val_len_cap: 10
test_len_cap: 10
epochs: 2

eval_step: 20
checkpoint_step: 20
workers: 4
device: 0
seed: 0
prefix: twibot20_cls_smoke
