dataset: twibot20
root: /dataMeR1/phil/data/twibot20/graphs
graph_filename: retweet_graph.pt
task_name: classification

edge_view: default
feature_subset: all
original_features: true
input_dim: 768

# Binary bot-vs-human episodes (label_names = ["human", "bot"]).
n_way: 2
n_shots: 3
n_query: 8
