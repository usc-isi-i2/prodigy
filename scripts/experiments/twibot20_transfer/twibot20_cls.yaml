dataset: twibot20
root: /dataMeR1/phil/data/twibot20/graphs
graph_filename: retweet_graph.pt
task_name: classification

edge_view: default
feature_subset: all
original_features: true
input_dim: 768

# Binary bot-vs-human episodes (label_names = ["human", "bot"]).
n_way: 2
n_shots: 3
n_query: 8
batch_size: 8

# Full run: 12 epochs x 10k episodes = 120,000 steps.
epochs: 12
dataset_len_cap: 10000
val_len_cap: 100
test_len_cap: 500

# Eval / checkpoint once per epoch (every dataset_len_cap steps). Keep these in
# sync with dataset_len_cap: a step is one batch, total steps = epochs x
# dataset_len_cap, and eval fires on `step % eval_step == 0`.
eval_step: 10000
checkpoint_step: 10000

workers: 4
device: 0
seed: 0
prefix: twibot20_cls
