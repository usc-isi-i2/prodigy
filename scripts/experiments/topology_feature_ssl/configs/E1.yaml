# E1 — DIRECTED STRUCTURAL INPUT FEATURES arm (topology_feature_ssl). Byte-for-byte
# identical to B0 EXCEPT one knob: structural_features = directed3. Per-node
# [in_deg, out_deg, log_deg] (z-scored per graph, directed from the retweet edges;
# in-deg=influence, out-deg=activity) are concatenated to the 768-d bio embedding,
# so input_dim becomes 771 (the trainer injects them and bumps input_dim; the eval
# sweep must pass --structural-features directed3 to match). Objective = NM.
#
# directed3 (not directed6): the merged pretrain graph has ~34M nodes, where the
# networkx features (k_core/pagerank/clustering) are intractable; degree features
# are exact/O(E) and carry the core directed signal. Pretrain and eval must share
# the input space, so both use directed3.
#
# Isolates *representable*: does giving the encoder explicit structural inputs let
# NM stop being ~chance under random bio features, and lift structure-linked
# regression? Subject to the leakage control — E1 counts as "learned structure"
# only if the frozen rep beats leakage_baseline.py on followers/statuses.
dataset: merged_ukr_rus_covid_midterm
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_midterm_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true
input_dim: 768          # trainer bumps to 771 after directed3 injection

emb_dim: 256
gnn_type: sage
n_layer: 1
n_hop: 1

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500
epochs: 12

neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: balanced

# >>> THE ONE CHANGE vs B0 <<<
structural_features: directed3

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags: [topology_feature_ssl, E1, structural_input, nm, directed3, merged3way, within_balanced]
prefix: tfssl_E1
