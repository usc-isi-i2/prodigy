# cov/mid validation — MERGED-NAIVE (proportional, mixed episodes). Baseline.
# Plain defaults; merged covid+midterm graph. See README.
dataset: merged_covid_midterm
root: /dataMeR1/phil/data/merged/graphs
graph_filename: covid_midterm_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

# merged budget: 12 epochs x 10000 = 120,000 episodes (2x single, as in ukr/cov)
epochs: 12

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags: [nm_covid_midterm, merged, naive, plain]
prefix: nm_cm_merged
