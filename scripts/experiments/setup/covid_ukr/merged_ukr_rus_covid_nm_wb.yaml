# ukr+cov rung of the ladder, within-balanced sampling (rung 2).
# Base config (256·S,U,M, no aug) + within-source episode confinement so it matches
# rungs 3-4; replaces the naive merged_ukr_rus_covid_nm run for the ladder.
dataset: covid19_twitter
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

# improved sampling: confine each NM episode to ONE source graph (removes cross-source
# negatives / the source-discrimination shortcut); uniform source weighting.
neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: balanced

eval_step: 100000        # skip periodic val-eval; watcher stops the run at step 40k
checkpoint_step: 1000
workers: 16
device: 0
seed: 0
prefix: merged_ukr_rus_covid_nm_wb
