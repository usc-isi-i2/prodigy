# Non-evidence resource gate: dense election graph, 20 n_hop=2 training steps.
dataset: election2020
root: /dataMeR1/phil/data/election2020/graphs
graph_filename: retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true
layers: S,U,M
gnn_type: sage
emb_dim: 256
n_layer: 1
dropout: 0

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 2
neighbor_sampling_hop_sizes: "9,9"
neighbor_sampling_node_limit: 101
neighbor_matching_walk_hops: 1
dataset_len_cap: 20
val_len_cap: 20
test_len_cap: 20

epochs: 1
eval_step: 100000
checkpoint_step: 20
checkpoint_steps: "0,20"
workers: 1
device: 0
seed: 0
prefix: sat_h2m_smoke_dense_election
