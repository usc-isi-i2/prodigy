# cov/mid validation — MERGED-WITHIN (proportional). Each episode confined to one
# source; source picked PROPORTIONAL to size, so the per-node center marginal matches
# the naive baseline (only cross-source negatives are removed). Identical to
# merged_nm.yaml except the one flag. See README.
dataset: merged_covid_midterm
root: /dataMeR1/phil/data/merged/graphs
graph_filename: covid_midterm_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500
epochs: 12

# >>> confine each episode to one source; source ~ size (proportional) <<<
neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: proportional

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags: [nm_covid_midterm, merged, within_source, proportional, plain]
prefix: nm_cm_within
