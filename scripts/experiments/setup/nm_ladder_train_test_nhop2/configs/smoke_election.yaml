n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
dataset_len_cap: 20
val_len_cap: 20
test_len_cap: 20
epochs: 1
eval_step: 100000
checkpoint_step: 20
checkpoint_steps: "0,20"
workers: 1
device: 0
seed: 0
prefix: nm_ladder_tts_h2m_smoke_election
