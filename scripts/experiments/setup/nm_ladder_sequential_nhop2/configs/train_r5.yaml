# Compute-matched 2-hop SEQUENTIAL NM ladder -- canonical order, rung 5/8.
# Adds election2020; active source order: ukraine -> covid -> midterm -> covid-political -> election2020-political.
# One continuous optimizer sees one contiguous block per source: ukraine=8000; covid=8000; midterm=8000; covid-political=8000; election2020-political=8000.
dataset: covid19_twitter
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_midterm_all8_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

emb_dim: 256
layers: S,U,M
gnn_type: sage
n_layer: 1
dropout: 0
n_hop: 2
neighbor_sampling_hop_sizes: "9,9"
neighbor_sampling_node_limit: 101
neighbor_matching_walk_hops: 1

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: balanced
neighbor_sampling_source_subset: ukr_rus,covid,midterm,covid_political,election2020
neighbor_sampling_source_sequence: ukr_rus,covid,midterm,covid_political,election2020
neighbor_sampling_source_sequence_steps: "8000,8000,8000,8000,8000"
neighbor_sampling_cross_source_prob: 0.0

# 4 x 10k is an honest 40k budget. Explicit checkpoints include every source boundary.
epochs: 4
eval_step: 100000
checkpoint_step: 10000
checkpoint_steps: "0,8000,16000,24000,32000,40000"
workers: 2
device: 0
seed: 0
prefix: nm_ladder_seq_h2m_r5
