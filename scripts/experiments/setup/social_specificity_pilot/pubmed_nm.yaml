dataset: pubmed
root: /dataMeR1/phil/data/pubmed/graphs
graph_filename: citation_graph.pt
task_name: neighbor_matching

edge_view: static_train
target_edge_view: static_test
neighbor_matching_edge_split: true
feature_subset: all
original_features: true

emb_dim: 256
layers: S,U,M
gnn_type: sage
n_layer: 1
dropout: 0
n_hop: 2
neighbor_sampling_hop_sizes: "9,9"
neighbor_sampling_node_limit: 101
neighbor_matching_walk_hops: 1

n_way: 30
n_shots: 3
n_query: 4
batch_size: 4
learning_rate: 0.002
weight_decay: 0.001
dataset_len_cap: 2500
val_len_cap: 500
test_len_cap: 500

epochs: 1
eval_step: 100000
checkpoint_step: 100000
checkpoint_steps: "100,300,900,2500"
print_step: 100
workers: 2
device: 0
seed: 0
tags:
  - social_specificity_pilot
  - citation
prefix: socialspec_pubmed_s0
