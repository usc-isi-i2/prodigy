# Order D rung 8: rung 7 plus twibot20. Rung 9 reuses the existing all-nine model.
# Train from random initialization and compare at the historical matched-40k checkpoint.
dataset: covid19_twitter
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_midterm_all9_facebook_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: balanced
neighbor_sampling_source_subset: ukr_rus,covid,midterm,covid_political,election2020,facebook_page_reference,ukr_rus_suspended,twibot20

epochs: 5
eval_step: 100000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags:
  - nm_ladder
  - order_D
  - rung_8
  - facebook_page_reference
prefix: nm_ladder_ordD_r8_facebook
