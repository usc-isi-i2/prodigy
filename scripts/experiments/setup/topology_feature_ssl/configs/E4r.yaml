# E4r — MULTI-TASK OBJECTIVE arm, ROTATION variant (topology_feature_ssl). Identical to
# E4.yaml (same E2 encoder, same three heads, same 40k budget) EXCEPT the heads are
# combined by per-episode rotation instead of a simultaneous weighted sum: one head per
# episode, round-robin over e4_task_counts (mfr:lp:struct), reusing the nm_fp_cl machinery.
# E4 (simultaneous) vs E4r (rotation) is the combination-mechanism ablation — does training
# all three heads every step beat alternating them, at matched total compute?
dataset: merged_ukr_rus_covid_midterm
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_midterm_retweet_graph.pt
task_name: e4_multi

edge_view: default
feature_subset: all
original_features: true
input_dim: 768          # trainer bumps to 771 after directed3 injection

emb_dim: 256
gnn_type: sage_multi    # E2's count-aware encoder (multi-agg + multi-readout)
n_layer: 1
n_hop: 1

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1           # REQUIRED for rotation: one head per gradient step
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500
epochs: 5               # true 40k (state_dict_40000); ~13.3k episodes per head at 1:1:1

neighbor_sampling_episode_source: graph_id
neighbor_sampling_episode_source_weighting: balanced

structural_features: directed3

# >>> E4-specific: multi-task heads, rotation <<<
e4_combine: rotation       # one head per episode, round-robin
e4_task_counts: "1,1,1"    # mfr:lp:struct round-robin weights
e4_weights: "30,1,1"       # mfr,lp,struct per-head scale (MFR up-weighted ~30×; see E4.yaml)
e4_lp_neg_k: 1
fp_mask_ratio: 0.3         # mfr/struct episodes mask whole nodes (lp episodes ignore it)
fp_mask_strategy: zero

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags: [topology_feature_ssl, E4r, multitask, mfr_dirlp_struct, rotation, sage_multi, directed3, merged3way, within_balanced]
prefix: tfssl_E4r
