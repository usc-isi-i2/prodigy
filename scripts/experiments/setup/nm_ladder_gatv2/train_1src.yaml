# Canonical NM ladder, rung 1: ukr_rus_twitter. GATv2 background encoder.
dataset: ukr_rus_twitter
root: /dataMeR1/phil/data/ukr_rus_twitter/graphs
graph_filename: retweet_graph_parquet.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

# Change exactly the sampled-subgraph encoder; keep the S,U,M topology so the
# metagraph remains the published M module.
gnn_type: gat
layers: S,U,M
emb_dim: 256
n_layer: 1
dropout: 0

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

# The post-2026-07-26 trainer writes a true terminal checkpoint. Four epochs are
# therefore exactly 40k; do not use the old five-epoch workaround or select 50k.
epochs: 4
eval_step: 100000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags:
  - nm_ladder_gatv2
  - rung_1
prefix: nm_ladder_gatv2_r1_1src
