# Naive-global 2-hop NM ladder -- canonical Order A, rung 7/8.
# Adds twibot20; the entire disjoint 7-source merge is sampled as one graph.
# Intentionally omit every graph_id/source-balancing option. Mixed-source episodes and
# node-mass weighting are the intervention; all other settings match nm_ladder_nhop2.
dataset: covid19_twitter
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_midterm_7src_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

emb_dim: 256
layers: S,U,M
gnn_type: sage
n_layer: 1
dropout: 0
n_hop: 2
neighbor_sampling_hop_sizes: "9,9"
neighbor_sampling_node_limit: 101
neighbor_matching_walk_hops: 1

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
dataset_len_cap: 10000
val_len_cap: 500
test_len_cap: 500

epochs: 4
eval_step: 100000
checkpoint_step: 10000
workers: 2
device: 0
seed: 0
prefix: nm_ladder_global_h2m_r7
