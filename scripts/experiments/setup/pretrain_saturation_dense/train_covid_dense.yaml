# Dense early-training retrain of the second single-source rung (covid19_twitter alone).
#
# Clone of covid_only/covid_only_nm.yaml -- the config behind
# covid_only_nm_14_06_2026_16_38_56 -- except for the step budget, the checkpoint
# schedule, eval_step, and the prefix. See train_ukr_dense.yaml for why eval_step
# deviates from the original's 1000 and what that costs (the 2001 splice probe is not
# comparable for this arm; the 1001 probe is).
dataset: covid19_twitter
root: /dataMeR1/phil/data/covid19_twitter/graphs
graph_filename: retweet_graph_parquet.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1

epochs: 1
dataset_len_cap: 2100
val_len_cap: 500
test_len_cap: 500

eval_step: 100000        # original: 1000 -- see train_ukr_dense.yaml
checkpoint_step: 1000    # inert: checkpoint_steps below overrides the modulo cadence
checkpoint_steps: "100,500,1000,1001,2000,2001"

workers: 16
device: 0
seed: 0
prefix: sat_dense_covid
