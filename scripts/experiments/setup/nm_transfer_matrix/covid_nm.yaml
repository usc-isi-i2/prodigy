# NM transfer matrix — train source: COVID only.
# Plain default architecture (NO augmentation, NO attr regression). Identical to
# ukr_nm.yaml except for the data source. See README.md.
dataset: covid19_twitter
root: /dataMeR1/phil/data/covid19_twitter/graphs
graph_filename: retweet_graph_parquet.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000   # episodes per epoch
val_len_cap: 500
test_len_cap: 500

# Compute budget (single-source): 6 epochs x 10000 = 60,000 episodes.
epochs: 6

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags:
  - nm_transfer_matrix
  - covid
  - plain
prefix: nm_matrix_covid
