# NM transfer matrix — train source: MERGED ukr+covid (disjoint, proportional).
# Plain default architecture (NO augmentation, NO attr regression). Identical to
# the single-source configs EXCEPT:
#   - the (proportional, as-is) merged graph, and
#   - epochs is DOUBLED to 12 so each domain is seen ~as often as in its
#     single-source run (fixed per-domain exposure, not fixed total compute).
# Caveat: under proportional sampling on a covid-dominant merge, covid is
# over-exposed and ukr under-exposed relative to their single-source runs. A
# size-balanced merge would make this exact; it was deliberately left out of
# this experiment. See README.md.
dataset: covid19_twitter   # label only; the graph below is the merged graph
root: /dataMeR1/phil/data/merged/graphs
graph_filename: ukr_rus_covid_retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000   # episodes per epoch
val_len_cap: 500
test_len_cap: 500

# Compute budget (merged): 12 epochs x 10000 = 120,000 episodes (2x single-source).
epochs: 12

eval_step: 10000
checkpoint_step: 10000
workers: 16
device: 0
seed: 0
tags:
  - nm_transfer_matrix
  - merged
  - plain
prefix: nm_matrix_merged
