# NM single-source transfer matrix — train source: ukr_rus_suspended only.
# Identical to every other config here except the data source. See README.md.
#
# CAVEAT: ukr_rus_suspended is SMALL/SPARSE — the eval harness drops it to
# nm_n_query=1 (vs 12 for the twitter graphs). 30-way NM training episodes need
# centers with enough neighbors; if this run errors or the diagonal looks
# degenerate, smoke-test first (`epochs: 1`) and consider a smaller n_way for the
# small graphs. Kept at n_way: 30 here for comparability with the rest of the matrix.
dataset: ukr_rus_suspended
root: /dataMeR1/phil/data/ukr_rus_suspended/graphs
graph_filename: retweet_graph.pt
task_name: neighbor_matching

edge_view: default
feature_subset: all
original_features: true

n_way: 30
n_shots: 3
n_query: 4
batch_size: 1
n_hop: 1
dataset_len_cap: 10000   # episodes per epoch
val_len_cap: 500
test_len_cap: 500

# Matched-40k: 5 epochs x 10k = 50,000 steps so a state_dict_40000 checkpoint is saved.
epochs: 5
eval_step: 100000        # > total steps => skip periodic val eval (~2x faster to 40k)
checkpoint_step: 10000   # ckpts at 10k / 20k / 30k / 40k
workers: 16
device: 0
seed: 0
tags:
  - nm_single_source_matrix
  - ukr_rus_suspended
  - plain
prefix: nm_ss_ukr_rus_suspended
