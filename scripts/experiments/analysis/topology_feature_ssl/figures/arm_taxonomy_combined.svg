<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 504" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Making the model use network structure — plain-language names with technical detail</title>
<desc>Three levers, each shown with a plain-language name in bold and the technical arm name below. Lever 1 (hide the easy clues): B0 starting point, B1 scramble profiles. Lever 2 (give it the right tools): E1 add popularity, E2 let it count, E2b unblur the counts. Lever 3 (change the goal): E4 three jobs at once, E4r three jobs in turns. Each version changes one thing from the one before.</desc>
<style>
  text{fill:#2c2c2a}
  .hdr{font-size:14px;font-weight:600;fill:#2c2c2a}
  .ts{font-size:12px;fill:#6a6862}
  .arr{stroke:#8a897f;stroke-width:1.5;fill:none}
  .divider{stroke:#d3d1c7;stroke-width:1}
  .g-fill{fill:#eaf3de;stroke:#639922;stroke-width:1.5}
  .g-title{font-size:14px;font-weight:600;fill:#27500a}
  .g-dot{fill:#639922}
  .b-fill{fill:#e6f1fb;stroke:#378add;stroke-width:1.5}
  .b-title{font-size:14px;font-weight:600;fill:#0c447c}
  .b-dot{fill:#378add}
  .a-fill{fill:#faeeda;stroke:#e0972b;stroke-width:1.5}
  .a-title{font-size:14px;font-weight:600;fill:#633806}
  .a-dot{fill:#ba7517}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#8a897f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="ts" x="40" y="26">The model reads profiles but ignores the network:</text>
<text class="ts" x="640" y="26" text-anchor="end" font-style="italic">bold = plain · grey = technical</text>

<!-- LEVER 1 -->
<circle class="g-dot" cx="45" cy="62" r="5"/>
<text class="hdr" x="58" y="66">1 · Hide the easy clues</text>
<text class="ts" x="58" y="83">corrupt the feature shortcut — change the data, not the model or goal</text>
<rect class="g-fill" x="40" y="95" width="176" height="58" rx="10"/>
<text class="g-title" x="128" y="118" text-anchor="middle">Starting point</text>
<text class="ts" x="128" y="137" text-anchor="middle">B0 · mean-agg · bio only</text>
<line class="arr" x1="216" y1="124" x2="247" y2="124" marker-end="url(#arrow)"/>
<rect class="g-fill" x="250" y="95" width="176" height="58" rx="10"/>
<text class="g-title" x="338" y="118" text-anchor="middle">Scramble profiles</text>
<text class="ts" x="338" y="137" text-anchor="middle">B1 · 30% → random feats</text>

<!-- LEVER 2 -->
<circle class="b-dot" cx="45" cy="189" r="5"/>
<text class="hdr" x="58" y="193">2 · Give it the right tools</text>
<text class="ts" x="58" y="210">make topology representable — change the encoder, keep NM</text>
<rect class="b-fill" x="40" y="222" width="176" height="58" rx="10"/>
<text class="b-title" x="128" y="245" text-anchor="middle">Add popularity</text>
<text class="ts" x="128" y="264" text-anchor="middle">E1 · + in/out/log-degree</text>
<line class="arr" x1="216" y1="251" x2="247" y2="251" marker-end="url(#arrow)"/>
<rect class="b-fill" x="250" y="222" width="176" height="58" rx="10"/>
<text class="b-title" x="338" y="245" text-anchor="middle">Let it count</text>
<text class="ts" x="338" y="264" text-anchor="middle">E2 · mean+sum+max agg</text>
<line class="arr" x1="426" y1="251" x2="457" y2="251" marker-end="url(#arrow)"/>
<rect class="b-fill" x="460" y="222" width="176" height="58" rx="10"/>
<text class="b-title" x="548" y="245" text-anchor="middle">Unblur the counts</text>
<text class="ts" x="548" y="264" text-anchor="middle">E2b · drop encoder BN</text>

<!-- LEVER 3 -->
<circle class="a-dot" cx="45" cy="316" r="5"/>
<text class="hdr" x="58" y="320">3 · Change the goal</text>
<text class="ts" x="58" y="337">make topology used — replace NM, keep E2's encoder</text>
<rect class="a-fill" x="40" y="349" width="176" height="58" rx="10"/>
<text class="a-title" x="128" y="372" text-anchor="middle">Three jobs at once</text>
<text class="ts" x="128" y="391" text-anchor="middle">E4 · MFR⊕dir-LP⊕struct</text>
<text class="ts" x="233" y="382" text-anchor="middle">vs</text>
<rect class="a-fill" x="250" y="349" width="176" height="58" rx="10"/>
<text class="a-title" x="338" y="372" text-anchor="middle">Three jobs, in turns</text>
<text class="ts" x="338" y="391" text-anchor="middle">E4r · same 3 heads</text>
<text class="ts" x="460" y="366">combine mode —</text>
<text class="ts" x="460" y="383">E4: all at once</text>
<text class="ts" x="460" y="400">E4r: take turns</text>

<!-- FOOTER -->
<line class="divider" x1="40" y1="429" x2="640" y2="429"/>
<text class="ts" x="40" y="450">Each version = the one before + one change.   B0→B1 · B0→E1→E2→E2b · E2→E4→E4r</text>
<text class="ts" x="40" y="468">NM neighbor-matching · MFR masked-feat recon · dir-LP directed link-pred · struct degree pred</text>
<text class="ts" x="40" y="486">All arms: 3-way merged graph · matched 40k budget · frozen-encoder eval · single seed</text>
</svg>
