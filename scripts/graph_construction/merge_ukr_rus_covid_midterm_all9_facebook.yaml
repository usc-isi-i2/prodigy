# Nine-source disjoint merge used to include Facebook in the source-order ladder.
# Keep all source graphs separate so graph_id remains 0..8 for source-aware sampling.
# The Facebook input is the connected structural view (attributed isolates removed).
inputs:
  - name: ukr_rus
    path: /dataMeR1/phil/data/ukr_rus_twitter/graphs/retweet_graph_parquet.pt
  - name: covid
    path: /dataMeR1/phil/data/covid19_twitter/graphs/retweet_graph_parquet.pt
  - name: midterm
    path: /dataMeR1/phil/data/midterm/graphs/retweet_graph_parquet.pt
  - name: covid_political
    path: /dataMeR1/phil/data/covid_political/graphs/retweet_graph.pt
  - name: election2020
    path: /dataMeR1/phil/data/election2020/graphs/retweet_graph.pt
  - name: ukr_rus_suspended
    path: /dataMeR1/phil/data/ukr_rus_suspended/graphs/retweet_graph.pt
  - name: twibot20
    path: /dataMeR1/phil/data/twibot20/graphs/retweet_graph.pt
  - name: cp_hk
    path: /dataMeR1/phil/data/cp_hk_twitter/graphs/retweet_graph.pt
  - name: facebook_page_reference
    path: /dataMeR1/phil/data/facebook_page_reference/graphs/page_reference_structural.pt
# Source graphs use incompatible edge schemas. The merged training artifact retains
# directed topology and 768-d node features only.
drop_edge_features: true
out: /dataMeR1/phil/data/merged/graphs/ukr_rus_covid_midterm_all9_facebook_graph.pt
