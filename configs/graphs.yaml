protocol:
  seed: 0
  input_dim: 768
  hidden_dim: 256
  output_dim: 256
  layers: 1
  dropout: 0.0
  fanout: 15
  ssl_batch_size: 1024
  negatives_per_positive: 5
  learning_rate: 0.001
  weight_decay: 0.00001
  max_steps: 10000
  checkpoint_steps: [100, 300, 600, 900, 1500, 2500, 5000, 10000]
  validation_interval: 250
  validation_batches: 20
  minimum_steps: 2500
  min_relative_improvement: 0.002
  patience_evaluations: 5
  labels_per_class: 10
  evaluated_steps: [100, 300, 900, 2500]
